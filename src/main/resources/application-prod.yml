spring:
  profiles:
    active: prod

  datasource:
    url: jdbc:mysql://wordtreasure-db.cna2qm04g4t2.us-east-1.rds.amazonaws.com:3306/wordtreasure
    username: admin
    password: admin123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create  # 최초 1회, 이후 validate로 변경
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: wordtreasure-cache.gdtqto.ng.0001.use1.cache.amazonaws.com
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

python:
  service:
    url: http://10.0.2.93:8000
    connect-timeout: 5000
    read-timeout: 30000

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /api-docs

logging:
  config: classpath:logback/logback-prod.xml
  level:
    cloudcomputing.wordtreasure: info #필요시 info, trace
    org.hibernate.sql: debug #SQL 쿼리 로깅