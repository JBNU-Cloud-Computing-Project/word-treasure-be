spring:
  datasource:
    url: jdbc:mysql://wordtreasure-db.cna2qm04g4t2.us-east-1.rds.amazonaws.com:3306/wordtreasure
    username: admin
    password: admin123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: wordtreasure-cache.gdtqto.ng.0001.use1.cache.amazonaws.com
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

python:
  service:
    url: http://10.0.1.125:8000
    connect-timeout: 10000
    read-timeout: 30000

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        secure: true
        same-site: None
        path: /

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /api-docs