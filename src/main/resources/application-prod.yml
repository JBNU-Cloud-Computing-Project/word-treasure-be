spring:
  datasource:
    url: jdbc:mysql://wordtreasure-db.cna2qm04g4t2.us-east-1.rds.amazonaws.com:3306/wordtreasure
    driver-class-name: org.h2.Driver
    username: admin
    password: admin123
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cache:
    type: redis  # Caffeine 대신 Redis
    redis:
      time-to-live: 300000  # 5분 (밀리초)

python:
  service:
    url: http://localhost:8000  # Python FastAPI 서버 주소
    connect-timeout: 10000       # 연결 타임아웃 (ms)
    read-timeout: 60000         # 읽기 타임아웃 (ms)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /api-docs

logging:
  config: classpath:logback/logback-local.xml
  level:
    cloudcomputing.wordtreasure: info #필요시 info, trace
    org.hibernate.sql: debug #SQL 쿼리 로깅